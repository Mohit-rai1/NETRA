# ============================================================
# Project NETRA — Backend Configuration
# ============================================================
spring.application.name=netra-backend

# --- Multipart Upload Limits ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# --- CV Engine (Python/FastAPI) ---
# Placeholder: set this to the actual engine URL when deployed
netra.cv-engine.base-url=http://localhost:8000

# --- Logging ---
logging.level.com.Netra.app=DEBUG
